<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Levels & Titles</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="index.css"/>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h1>Levels &amp; Titles</h1>
      <p>Your journey through the Pulse</p>
    </div>

    <div class="timeline">
      <div class="track"><div class="track-fill"></div></div>

      <div class="level-row locked">
        <span class="level-label">LEVEL 10</span>
        <span class="dot"></span>
        <span class="level-title">Pundit</span>
      </div>

      <div class="level-row locked">
        <span class="level-label">LEVEL 9</span>
        <span class="dot"></span>
        <span class="level-title">Legend</span>
      </div>

      <div class="level-row locked">
        <span class="level-label">LEVEL 8</span>
        <span class="dot"></span>
        <span class="level-title">Master</span>
      </div>

      <div class="level-row locked">
        <span class="level-label">LEVEL 7</span>
        <span class="dot"></span>
        <span class="level-title">Expert</span>
      </div>

      <div class="level-row locked">
        <span class="level-label">LEVEL 6</span>
        <span class="dot"></span>
        <span class="level-title">Specialist</span>
      </div>

      <div class="level-row active">
        <span class="level-label">LEVEL 5</span>
        <span class="dot"></span>
        <span class="level-title">
          Skilled
          <span class="xp-badge">500 / 500 XP</span>
        </span>
      </div>

      <div class="level-row completed">
        <span class="level-label">LEVEL 4</span>
        <span class="dot"></span>
        <span class="level-title">Scout</span>
      </div>

      <div class="level-row completed">
        <span class="level-label">LEVEL 3</span>
        <span class="dot"></span>
        <span class="level-title">Apprentice</span>
      </div>

      <div class="level-row completed">
        <span class="level-label">LEVEL 2</span>
        <span class="dot"></span>
        <span class="level-title">Trainee</span>
      </div>

      <div class="level-row completed">
        <span class="level-label">LEVEL 1</span>
        <span class="dot"></span>
        <span class="level-title">Novice</span>
      </div>
    </div>

    <p class="footer-note">
      Titles will appear in <span class="premium">PREMIUM</span>
    </p>
  </div>

</body>
</html>
