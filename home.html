<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYNX</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>

    <section class="discovery-section">
        <h1 class="main-title">FIND YOUR <span class="accent-text">NEXT VIBE</span></h1>
        <p class="subtitle">Hyper-personalized discovery powered by FYNX AI</p>

        <div class="search-container">
            <div class="search-bar">
                <span class="icon">🔍</span>
                <input type="text" placeholder="Describe your show">
                <div class="toggle-switch">
                    <button class="toggle-btn active">AI Discovery</button>
                    <button class="toggle-btn">Standard</button>
                </div>
                <button class="go-btn">➔</button>
            </div>
        </div>

        <div class="tag-container">
            <button class="tag-btn"><span class="icon">😊</span> Mood Finder</button>
            <button class="tag-btn"><span class="icon">🧠</span> Personality Test</button>
        </div>
    </section>


</html>




    <script src="home.js"></script>
    
</body>
</html>
