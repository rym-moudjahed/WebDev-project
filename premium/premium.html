<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upgrade to Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="premium.css">
 
</head>
<body>

  <div class="card">

    <!-- Wave header -->
    <div class="card-header">
      <div class="wave-bg"></div>
      <div class="header-content">
        <div class="crown-icon">
          <svg width="22" height="20" viewBox="0 0 22 20" fill="none">
            <path d="M1 15 L4 5 L8.5 11 L11 2 L13.5 11 L18 5 L21 15 Z" stroke="#4fc3c3" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
            <rect x="2" y="16" width="18" height="2.5" rx="1.2" fill="#4fc3c3" opacity="0.7"/>
          </svg>
        </div>
        <h1>Upgrade to Premium 💎</h1>
        <p>Unlock more power</p>
      </div>
    </div>

    <!-- Body -->
    <div class="card-body">

      <!-- AI Search -->
      <div class="section">
        <div class="section-title">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="7.5" cy="7.5" r="5" stroke="#4fc3c3" stroke-width="1.5"/>
            <path d="M11.5 11.5 L15.5 15.5" stroke="#4fc3c3" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M5.5 7.5 Q7.5 5 9.5 7.5" stroke="#4fc3c3" stroke-width="1.2" stroke-linecap="round" fill="none"/>
            <circle cx="7.5" cy="9.5" r="0.9" fill="#4fc3c3"/>
          </svg>
          AI SEARCH
        </div>
        <div class="feature-row">
          <div class="feature-card free">
            <span class="badge free-badge">FREE</span>
            <p>Use AI search 3 times/day for free</p>
          </div>
          <div class="feature-card premium-card">
            <span class="badge premium-badge">PREMIUM</span>
            <span class="card-star">✦</span>
            <p>Advanced &amp; unlimited search in Premium</p>
          </div>
        </div>
      </div>

      <!-- Writing & XP -->
      <div class="section">
        <div class="section-title">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M3 14 L3 16 L5 16 L15 6 L13 4 Z" stroke="#4fc3c3" stroke-width="1.4" stroke-linejoin="round" fill="none"/>
            <path d="M13 4 L15 6" stroke="#4fc3c3" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          WRITING &amp; XP
        </div>
        <div class="feature-row">
          <div class="feature-card free">
            <span class="badge free-badge">FREE</span>
            <p>Write articles and earn XP</p>
          </div>
          <div class="feature-card premium-card">
            <span class="badge premium-badge">PREMIUM</span>
            <span class="card-star">★</span>
            <p>XP Boosts &amp; exclusive titles in Premium</p>
          </div>
        </div>
      </div>

      <!-- CTA -->
      <button class="go-premium-btn">
        <span class="btn-bottom">Go Premium</span>
      </button>

      <button class="continue-free-btn">Continue Free</button>

      <p class="fine-print">Cancel anytime. Taxes may apply based on your location.</p>

    </div>
  </div>

</body>
</html>
